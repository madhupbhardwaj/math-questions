# Rebuilds the search-engine pages from the Google Sheet:
#   q/<id>/ question pages, assets/og/ preview pictures, the questions
#   snapshot, the static topic lists, sitemap.xml, robots.txt and 404.html.
# Runs every 3 hours, after every change to main, and on demand
# (Actions tab → "Build question pages" → Run workflow).
name: Build question pages

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "q/**"
      - "assets/og/**"
      - "assets/data/**"
      - "sitemap.xml"
      - "robots.txt"
      - "404.html"

permissions:
  contents: write
  pages: write

concurrency:
  group: build-question-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Build pages from the sheet
        run: node tools/build-pages.cjs

      - name: Commit and publish changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A q assets/og assets/data sitemap.xml robots.txt 404.html \
            number-theory/index.html trigonometry/index.html calculus/index.html \
            combinatorics/index.html algebra/index.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update question pages from the sheet"
          git push
          # Make sure GitHub Pages republishes (pushes from Actions may not trigger it)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request skipped"
